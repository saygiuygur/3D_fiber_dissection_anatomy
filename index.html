  <style>
    :root{ --viewer-bg: #ffffff; }
    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:flex; height:100vh; }

    .sidebar{
      width:360px;
      border-right:1px solid #ddd;
      padding:12px;
      overflow:auto;
      background:#fff;
    }

    .row{
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px; margin:6px 0;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      user-select:none;
      gap:10px;
      transition: border-color 120ms ease;
    }
    .row.active { border-color:#111; }
    .row.downloading:not(.active) { border-color: rgba(0,0,0,0.25); }

    .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex: 1 1 auto; }
    .meta{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex: 0 0 24px; }
    .status-icon{ width:20px; height:20px; display:block; }
    .small{ font-size:12px; color:#666; margin-top:10px; line-height:1.4; }

    .toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin: 4px 0 14px;
      padding: 8px 0;
    }
    .toggle-title{
      font-size:14px;
      font-weight:600;
      margin:0;
    }

    .switch{
      position: relative;
      display:inline-block;
      width: 52px;
      height: 30px;
      flex: 0 0 auto;
    }
    .switch input{ opacity:0; width:0; height:0; }
    .slider{
      position:absolute;
      cursor:pointer;
      inset:0;
      background:#d9d9d9;
      transition: .2s;
      border-radius:999px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    }
    .slider:before{
      content:"";
      position:absolute;
      height: 24px;
      width: 24px;
      left: 3px;
      top: 3px;
      background:#fff;
      transition: .2s;
      border-radius:50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .switch input:checked + .slider{ background:#35c759; }
    .switch input:checked + .slider:before{ transform: translateX(22px); }

    .bg-section{ margin-top:18px; }
    .bg-title{ font-size:14px; font-weight:600; margin:0 0 10px 0; }
    .bg-options{ display:flex; align-items:center; gap:14px; margin-bottom:8px; }

    .swatch{
      width:26px; height:26px;
      border-radius:50%;
      border:1px solid #cfcfcf;
      cursor:pointer;
      padding:0;
      display:inline-block;
      box-sizing:border-box;
    }
    .swatch.white{ background:#ffffff; }
    .swatch.gray{ background:#808080; }
    .swatch.black{ background:#000000; }
    .swatch.selected{ outline:2px solid #111; outline-offset:3px; }

    .viewer-wrap{
      position: relative;
      width: calc(100vw - 360px);
      height: 100vh;
      background:var(--viewer-bg);
      overflow:hidden;
    }

    model-viewer.viewer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:10;
  background:var(--viewer-bg);
  --min-hotspot-opacity: 1;
}

/* ===== Right-side DTI panel ===== */
#dtiPanel{
  position:absolute;
  right:14px;
  top:14px;
  z-index:58;
  width:260px;
  max-height:calc(100vh - 28px);
  overflow:auto;
  padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,0.88);
  color:#111;
  box-shadow:0 8px 24px rgba(0,0,0,0.18);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-sizing:border-box;
}

#dtiPanel h3{
  margin:0 0 10px 0;
  font-size:15px;
  line-height:1.2;
}

.dti-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 4px;
  border-bottom:1px solid rgba(0,0,0,0.08);
  font-size:13px;
  user-select:none;
  cursor:pointer;
}

.dti-row:last-child{
  border-bottom:none;
}

.dti-row input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.dti-dot{
  width:18px;
  height:18px;
  flex:0 0 18px;
  border-radius:50%;
  box-sizing:border-box;
  border:1.3px solid #8a8a8a;
  background:
    radial-gradient(circle at 30% 22%,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.65) 24%,
      rgba(255,255,255,0.05) 46%,
      rgba(0,0,0,0.10) 72%,
      rgba(255,255,255,0.35) 100%
    ),
    linear-gradient(160deg,
      #f7f7f7 0%,
      #e9e9e9 28%,
      #b9b9b9 55%,
      #eeeeee 100%
    );
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.9),
    inset 0 -1px 2px rgba(0,0,0,0.22);
}

.dti-row input:checked + .dti-dot{
  border-color:#7a7a7a;
  background:
    radial-gradient(circle at 30% 22%,
      rgba(255,255,255,0.92) 0%,
      rgba(255,255,255,0.58) 24%,
      rgba(255,255,255,0.08) 44%,
      rgba(0,0,0,0.18) 72%,
      rgba(255,255,255,0.25) 100%
    ),
    linear-gradient(160deg,
      color-mix(in srgb, var(--dti-color, #777) 25%, white) 0%,
      color-mix(in srgb, var(--dti-color, #777) 75%, white) 30%,
      color-mix(in srgb, var(--dti-color, #777) 85%, black) 58%,
      color-mix(in srgb, var(--dti-color, #777) 45%, white) 100%
    );
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.85),
    inset 0 -1px 2px rgba(0,0,0,0.28);
}
.dti-name{
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dti-status{
  width:20px;
  flex:0 0 20px;
  text-align:center;
  font-size:12px;
  color:#666;
}
  .hiddenViewer {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 9 !important;
}

  .shownViewer {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  z-index: 20 !important;
}

    .hotspot{
      width: 14px;
      height: 14px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #000;
      background: rgba(255,255,255,0.65);
      cursor: pointer;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
    }
    .hotspot.selected{
      border-color: #1e88e5;
    }
    .hotspot.occluded{
      opacity: 0;
      pointer-events: none;
    }

    #hotspotTip{
      position: absolute;
      z-index: 60;
      display: none;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 12px;
      line-height: 1.2;
      pointer-events: none;
      max-width: 280px;
      white-space: nowrap;
    }

    .annOff .hotspot{ display:none !important; }
    .annOff #hotspotTip{ display:none !important; }

    #annoNav{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:55;
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 16px;
  border-radius:999px;
  background: rgba(0,0,0,0.60);
  color:#fff;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  width: var(--anno-nav-width, 260px);
  max-width: min(560px, 92vw);
  box-sizing:border-box;
  user-select:none;
}
    #annoNav .navBtn{
      width:28px;
      height:28px;
      border:none;
      border-radius:999px;
      background: rgba(255,255,255,0.12);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex: 0 0 28px;
      font-size:18px;
      line-height:1;
    }
    #annoNav .navBtn:hover{ background: rgba(255,255,255,0.18); }
    #annoNav .navText{
      flex: 1 1 auto;
      min-width: 0;
      text-align:center;
      font-size:14px;
      font-weight:600;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      letter-spacing: 0.2px;
    }

function getDtiSceneRoot(mv) {
  const scene = getMvScene(mv);
  if (!scene) return null;

  if (typeof scene.add === "function" && typeof scene.remove === "function") {
    return scene;
  }

  return null;
}

function cleanObjectName(name) {
  return String(name || "")
    .trim()
    .replace(/\.\d+$/, "");
}

function referenceKey(name) {
  return cleanObjectName(name)
    .replace(/[\s_\-]+/g, "")
    .replace(/\d+$/g, "")
    .toLowerCase();
}

function isDtiObjectOrInsideDti(obj) {
  let cur = obj;

  while (cur) {
    if (cur.userData?.__isDTI) return true;
    cur = cur.parent;
  }

  return false;
}

function findAnatomicalObjectByExactName(scene, wantedName) {
  if (!scene || !wantedName) return null;

  let found = null;

  scene.traverse?.(obj => {
    if (found) return;
    if (isDtiObjectOrInsideDti(obj)) return;

    if (obj.name === wantedName) found = obj;
  });

  return found;
}

function getModel1ReferenceKeySet() {
  return new Set(MODEL01_NAMES.map(referenceKey));
}

function findObjectByReferenceKey(scene, wantedNameOrKey) {
  if (!scene || !wantedNameOrKey) return null;

  const wantedKey = referenceKey(wantedNameOrKey);
  let found = null;

  scene.traverse?.(obj => {
    if (found) return;

    // Never use copied DTI reference empties as anatomical targets.
    if (isDtiObjectOrInsideDti(obj)) return;

    if (referenceKey(obj.name) === wantedKey) found = obj;
  });

  return found;
}

}

  ui.status.innerHTML = "";
}

function markAsDtiObject(root, dtiId) {
  root.name = `DTI_${dtiId}`;
  root.userData.__isDTI = true;

  root.traverse?.(obj => {
    obj.userData.__isDTI = true;

    if (!obj.isMesh) return;

    obj.frustumCulled = false;
    obj.renderOrder = 0;

    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];

    for (const mat of mats) {
      if (!mat) continue;
      mat.depthTest = true;
      if (!mat.transparent) mat.depthWrite = true;
      mat.needsUpdate = true;
    }
  });

  return root;
}

async function loadDtiPrototype(dti) {
  if (dtiPrototypePromises.has(dti.id)) {
    return dtiPrototypePromises.get(dti.id);
  }

  const p = new Promise((resolve, reject) => {
    setDtiStatus(dti.id, "loading", "0%");

    dtiLoader.load(
      dti.url,
      gltf => {
        const root = gltf.scene || gltf.scenes?.[0];

        if (!root) {
          setDtiStatus(dti.id, "error");
          reject(new Error(`No scene found in ${dti.url}`));

function makeReferencePairs(sourceRefs, targetRefs) {
  const pairs = [];

  for (const [key, sourcePoint] of sourceRefs.entries()) {
    const targetPoint = targetRefs.get(key);
    if (!targetPoint) continue;

    pairs.push({
      name: key,
      source: sourcePoint.clone(),
      target: targetPoint.clone()

  }

  return pairs;
}

function pointLineDistance(p, a, b) {
  const ab = b.clone().sub(a);
  const len = ab.length();
  if (len < 1e-9) return 0;

  const ap = p.clone().sub(a);
  return ap.cross(ab).length() / len;
}

function chooseStableReferenceTriangle(pairs) {
  if (pairs.length < 3) return null;

  let bestI = 0;
  let bestJ = 1;
  let bestDist = -Infinity;

  for (let i = 0; i < pairs.length; i++) {
    for (let j = i + 1; j < pairs.length; j++) {
      const d = pairs[i].target.distanceTo(pairs[j].target);
      if (d > bestDist) {
        bestDist = d;
        bestI = i;
        bestJ = j;
      }
    }
  }

  if (!Number.isFinite(bestDist) || bestDist < 1e-6) return null;

  let bestK = -1;
  let bestHeight = -Infinity;

  const a = pairs[bestI].target;
  const b = pairs[bestJ].target;

  for (let k = 0; k < pairs.length; k++) {
    if (k === bestI || k === bestJ) continue;

    const h = pointLineDistance(pairs[k].target, a, b);
    if (h > bestHeight) {
      bestHeight = h;
      bestK = k;
    }
  }

  if (bestK < 0 || !Number.isFinite(bestHeight) || bestHeight < 1e-6) return null;

  return [pairs[bestI], pairs[bestJ], pairs[bestK]];
}

function makeFrameFromTriangle(a, b, c) {
  const x = b.clone().sub(a);
  const xLen = x.length();
  if (xLen < 1e-9) return null;

  const u = x.clone().normalize();
  const ac = c.clone().sub(a);
  const normal = x.clone().cross(ac);
  const normalLen = normal.length();
  if (normalLen < 1e-9) return null;

  const w = normal.clone().normalize();
  const v = w.clone().cross(u).normalize();

  const height = pointLineDistance(c, a, b);

  return {
    origin: a.clone(),
    u,
    v,
    w,
    lengthAB: xLen,
    height
  };
}

function makeBasisMatrix(frame, scale = 1) {
  const m = new THREE.Matrix4();

  m.makeBasis(
    frame.u.clone().multiplyScalar(scale),
    frame.v.clone().multiplyScalar(scale),
    frame.w.clone().multiplyScalar(scale)
  );

  m.setPosition(frame.origin);
  return m;
}

function buildAlignmentMatrixFromPairs(pairs) {
  const tri = chooseStableReferenceTriangle(pairs);
  if (!tri) return null;

  const [A, B, C] = tri;

  const sourceFrame = makeFrameFromTriangle(A.source, B.source, C.source);
  const targetFrame = makeFrameFromTriangle(A.target, B.target, C.target);

  if (!sourceFrame || !targetFrame) return null;

  const scaleCandidates = [];

  if (sourceFrame.lengthAB > 1e-9) {
    scaleCandidates.push(targetFrame.lengthAB / sourceFrame.lengthAB);
  }

  if (sourceFrame.height > 1e-9) {
    scaleCandidates.push(targetFrame.height / sourceFrame.height);
  }

  const scale = scaleCandidates.length
    ? scaleCandidates.reduce((a, b) => a + b, 0) / scaleCandidates.length
    : 1;

  if (!Number.isFinite(scale) || scale <= 0) return null;

  const sourceMatrix = makeBasisMatrix(sourceFrame, 1);
  const targetMatrix = makeBasisMatrix(targetFrame, scale);

  return targetMatrix.multiply(sourceMatrix.clone().invert());
}

function applyLandmarkAlignmentToDti(dtiObj, dtiId) {
  const sourceRefs = collectDtiReferencePoints(dtiObj);

  if (sourceRefs.size < DTI_MIN_REFERENCE_PAIRS) {
    console.warn(`DTI ${dtiId}: only ${sourceRefs.size} matching model-1 reference empties found.`);
    return false;
  }

  const targetRefs = collectTargetReferencePoints(sourceRefs.keys());
  const pairs = makeReferencePairs(sourceRefs, targetRefs);

  if (pairs.length < DTI_MIN_REFERENCE_PAIRS) {
    console.warn(`DTI ${dtiId}: only ${pairs.length} reference pairs found.`);
    return false;
  }

  const matrix = buildAlignmentMatrixFromPairs(pairs);

  if (!matrix) {
    console.warn(`DTI ${dtiId}: could not build alignment matrix.`);
    return false;
  }

  dtiObj.applyMatrix4(matrix);
  dtiObj.updateMatrixWorld?.(true);

  console.log(`Aligned DTI ${dtiId} using ${pairs.length} reference pairs.`);
  return true;

    return;

  if (currentShownId === DTI_REFERENCE_MODEL_ID) {
    cacheModel1ReferencePointsFromViewer(mv);
  }

  unmountAllDtiFromViewer(idleMv);

  const mounted = getMountedDtiMap(mv);

  for (const [id, obj] of Array.from(mounted.entries())) {
    if (!dtiEnabled.has(id) || !obj.parent) {
      try {
        if (obj.parent) obj.parent.remove(obj);
      } catch (_) {}
      mounted.delete(id);
    }
  }

  for (const id of dtiEnabled) {
    if (mounted.has(id) && mounted.get(id).parent) {
      setDtiStatus(id, "done");
      continue;
    }

    const dti = DTI_MODELS.find(x => x.id === id);
    if (!dti) continue;

    try {

      const alignedProto = await getAlignedDtiPrototype(dti, mv);
      if (token !== dtiRefreshToken || mv !== activeMv) return;

      const obj = cloneDtiObject(alignedProto, id);

      obj.__dtiBasePosition = obj.position.clone();

      scene.add(obj);
      mounted.set(id, obj);
      applyDtiPanOffsetToViewer(mv);

      try { mv.requestUpdate?.(); } catch (_) {}

      dtiEnabled.delete(id);

      const ui = dtiUi.get(id);
      if (ui?.checkbox) ui.checkbox.checked = false;

      setDtiStatus(id, "error");

  try { mv.requestUpdate?.(); } catch (_) {}

        const activeSrc = activeMv.src || "";
        const idleSrc = idleMv.src || "";

        if (activeSrc === targetSrc) { savingEnabled = true; return; }

        if (idleSrc === targetSrc) {
          applyAfterLoad();
          finalizeAfterBarrier();
          return;
        }

        const onIdleLoad = () => {
          if (token !== swapToken) return;
          applyAfterLoad();
          finalizeAfterBarrier();
        };
        idleMv.addEventListener('load', onIdleLoad, { once:true });
        await prewarmModelBaseState(modelId, targetSrc);
        idleMv.src = targetSrc;
        return;
      }

      const onIdleLoad = () => {
        if (token !== swapToken) return;
        applyAfterLoad();
        finalizeAfterBarrier();
      };
      idleMv.addEventListener('load', onIdleLoad, { once:true });

      try {
        const blobUrl = await downloadToBlobUrl(modelId);
        await prewarmModelBaseState(modelId, blobUrl);
        if (token !== swapToken) return;
        idleMv.src = blobUrl;
      } catch (_) {
        savingEnabled = true;
      }
    }

    async function onUserSelect(modelId) {
  const st = state.get(modelId);

  // If model 1 is currently downloading, do not abort it.
  // Wait until it finishes, then show the clicked model.
  if (
    currentDownloadingId === PRIMARY_MODEL_ID &&
    state.get(PRIMARY_MODEL_ID)?.status === "loading" &&
    modelId !== PRIMARY_MODEL_ID
  ) {
    try {
      await inFlight.get(PRIMARY_MODEL_ID);
    } catch (_) {}
  } else if (!(st.status === "done" && st.blobUrl)) {
    pausePreloadForAWhile();
  }

  showModel(modelId);
}

    // init
    buildListOnce();
buildDtiListOnce();

setMainViewerShown(mvA, true);
setMainViewerShown(mvB, false);

initBackgroundSelector();
initAnnotationsToggle();
refreshAnnoNavLabel();
updateSelectedHotspotVisual();

    showModel(selectedId).then(() => {
      resumeRequested = true;
      maybeResumePreload();
    });
  </script>
</body>
