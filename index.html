<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Fiber Dissection Anatomy</title>

  <!-- prevent favicon.ico noise -->
  <link rel="icon" href="data:," />

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:flex; height:100vh; }
    .sidebar { width:420px; border-right:1px solid #ddd; padding:12px; overflow:auto; background:#fff; }
    .topline { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
    .hint { font-size:12px; color:#666; line-height:1.4; margin-top:6px; }
    .row {
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px; margin:6px 0; border:1px solid #ddd;
      border-radius:10px; background:#fff; cursor:pointer; user-select:none; gap:12px;
    }
    .row.active { border-color:#111; }
    .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta { font-size:12px; color:#666; display:flex; align-items:center; gap:8px; flex:0 0 auto; }
    .tick { color:#0a8a0a; font-weight:900; }
    .tag { font-size:11px; padding:2px 6px; border:1px solid #ddd; border-radius:999px; color:#444; }
    model-viewer { width:calc(100vw - 420px); height:100vh; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="sidebar">
      <div class="topline">
        <h3 style="margin:6px 0;">Models</h3>
        <span id="now" class="tag">idle</span>
      </div>
      <div class="hint">
        Auto-preloads 01 → 11 in the background.<br>
        You can click anytime — your selected model always wins (background will NOT override it).
      </div>

      <div id="list" style="margin-top:10px;"></div>
    </div>

    <model-viewer id="mv"
      camera-controls
      interaction-prompt="none"
      exposure="1"
      shadow-intensity="1"
      loading="eager">
    </model-viewer>
  </div>

  <script>
    // ====== CONFIG: your models ======
    const MODELS = [
      ["01_Veselled","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled.glb"],
      ["02_Veselless","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/02_Veselless.glb"],
      ["03_U_Fibers","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/03_U_Fibers.glb"],
      ["04_Superficial_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/04_Superficial_SLF.glb"],
      ["05_Superficial_Arcuate","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/05_Superficial_Arcuate.glb"],
      ["06_Arcuate_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/06_Arcuate_SLF.glb"],
      ["07_Extreme_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/07_Extreme_Capsule.glb"],
      ["08_Claustrum","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/08_Claustrum.glb"],
      ["09_Putamen_External_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/09_Putamen_External_Capsule.glb"],
      ["10_Internal_Capsule_Perforators","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/10_Internal_Capsule_Perforators.glb"],
      ["11_Anterior_Comissure","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/11_Anterior_Comissure.glb"],
    ];

    // ====== UI refs ======
    const mv = document.getElementById("mv");
    const list = document.getElementById("list");
    const now = document.getElementById("now");

    // Hide model-viewer's built-in top progress bar (we show our own per-item progress)
    const style = document.createElement("style");
    style.textContent = `model-viewer::part(default-progress-bar){ display:none !important; }`;
    document.head.appendChild(style);

    // ====== State ======
    // status: idle | queued | loading | paused | done | error
    const state = new Map();
    for (const [id] of MODELS) state.set(id, { status:"queued", pct:null, mb:0, blobUrl:null });

    // What the user wants to see (viewer should ALWAYS follow this)
    let selectedId = MODELS[0][0];

    // One active fetch at a time
    let controller = null;
    let downloadingId = null;

    // Background queue in order
    let queue = MODELS.map(([id]) => id);

    function urlOf(id){ return MODELS.find(x => x[0] === id)[1]; }

    function metaText(id){
      const st = state.get(id);
      if (st.status === "done") return `<span class="tick">✓</span>`;
      if (st.status === "error") return `error`;
      if (st.status === "paused") {
        if (st.pct != null) return `paused (${st.pct}%)`;
        if (st.mb > 0) return `paused (${st.mb.toFixed(1)}MB)`;
        return `paused`;
      }
      if (st.status === "loading") {
        if (st.pct != null) return `${st.pct}%`;
        if (st.mb > 0) return `${st.mb.toFixed(1)}MB`;
        return `loading…`;
      }
      return ""; // idle/queued
    }

    function render(){
      list.innerHTML = "";
      for (const [id] of MODELS) {
        const row = document.createElement("div");
        row.className = "row" + (id === selectedId ? " active" : "");
        row.onclick = () => onUserSelect(id);

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = id;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = metaText(id);

        row.appendChild(name);
        row.appendChild(meta);
        list.appendChild(row);
      }

      if (downloadingId) {
        now.textContent = `downloading: ${downloadingId}`;
      } else {
        now.textContent = `idle`;
      }
    }

    function abortCurrentAndMarkPaused(){
      if (controller) {
        controller.abort();
        if (downloadingId) {
          const prev = state.get(downloadingId);
          if (prev && prev.status === "loading") prev.status = "paused";
        }
      }
    }

    async function download(id){
      const st = state.get(id);

      // already cached
      if (st.status === "done" && st.blobUrl) return st.blobUrl;

      // Abort any current download (this is what creates the "pause" effect)
      abortCurrentAndMarkPaused();

      controller = new AbortController();
      downloadingId = id;

      st.status = "loading";
      st.pct = null;
      st.mb = st.mb || 0;
      render();

      const res = await fetch(urlOf(id), { signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const total = Number(res.headers.get("Content-Length")) || null;
      const reader = res.body.getReader();

      let received = 0;
      const chunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        chunks.push(value);
        received += value.byteLength;

        st.mb = received / (1024*1024);
        if (total) st.pct = Math.floor((received / total) * 100);

        render();
      }

      const blob = new Blob(chunks, { type:"model/gltf-binary" });
      const blobUrl = URL.createObjectURL(blob);

      st.status = "done";
      st.pct = 100;
      st.blobUrl = blobUrl;

      downloadingId = null;
      controller = null;

      render();
      return blobUrl;
    }

    async function showSelected(){
      const id = selectedId;
      const st = state.get(id);

      // If already downloaded, instant
      if (st.status === "done" && st.blobUrl) {
        mv.src = st.blobUrl;
        render();
        return;
      }

      try {
        const blobUrl = await download(id);

        // Only switch if user hasn't changed selection mid-download
        if (selectedId === id) {
          mv.src = blobUrl;
        }
      } catch (e) {
        if (e.name === "AbortError") return; // expected when user clicks something else
        state.get(id).status = "error";
        downloadingId = null;
        controller = null;
        render();
      }
    }

    function moveToFrontOfQueue(id){
      queue = [id, ...queue.filter(x => x !== id)];
    }

    async function pumpBackground(){
      // Background downloads in order, but NEVER overrides selected model in the viewer.
      while (true) {
        // If something is downloading and it's the selected model, wait (don't fight it)
        if (downloadingId && downloadingId === selectedId) return;

        // Pick next not done, prefer ones that aren't the selected model
        let next = queue.find(x => x !== selectedId && state.get(x).status !== "done" && state.get(x).status !== "error");
        if (!next) {
          next = queue.find(x => state.get(x).status !== "done" && state.get(x).status !== "error");
        }
        if (!next) return; // all done or errored

        // If user selected something not done, do that first (priority)
        if (state.get(selectedId).status !== "done") {
          return; // user selection will drive download via showSelected()
        }

        try {
          // download next in background (does NOT change mv.src)
          await download(next);
          // loop continues to next
        } catch (e) {
          if (e.name === "AbortError") return; // user interaction
          state.get(next).status = "error";
          downloadingId = null;
          controller = null;
          render();
          // continue
        }
      }
    }

    function onUserSelect(id){
      selectedId = id;
      moveToFrontOfQueue(id);
      render();

      // Always prioritize user selection
      showSelected().then(() => {
        // After selected is done (or already done), continue background loading
        pumpBackground();
      });
    }

    // ====== init ======
    render();
    // Start by selecting the first model
    onUserSelect(MODELS[0][0]);

    // When the first one becomes done, background will continue through the rest.
    // Also, if the user clicks any time, their choice always wins.
  </script>
</body>
</html>
