<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Fiber Dissection Anatomy</title>
  <link rel="icon" href="data:," />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:flex; height:100vh; }
    .sidebar { width:420px; border-right:1px solid #ddd; padding:12px; overflow:auto; background:#fff; }
    .row {
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px; margin:6px 0; border:1px solid #ddd;
      border-radius:10px; background:#fff; cursor:pointer; user-select:none; gap:12px;
    }
    .row.active { border-color:#111; }
    .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta { font-size:12px; color:#666; flex:0 0 auto; }
    .tick { color:#0a8a0a; font-weight:900; }
    .small { font-size:12px; color:#666; margin-top:10px; line-height:1.4; }
    model-viewer { width:calc(100vw - 420px); height:100vh; }

    /* hide model-viewer's own bar; we show progress in the list */
    model-viewer::part(default-progress-bar){ display:none !important; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="sidebar">
      <h3 style="margin:6px 0 12px;">Models</h3>
      <div id="list"></div>
      <div class="small">
        One download at a time (viewer OR background preloader).<br>
        Clicking always works while downloading.
      </div>
    </div>

    <!-- Visible viewer -->
    <model-viewer id="mv"
      camera-controls
      interaction-prompt="none"
      exposure="1"
      shadow-intensity="1"
      loading="eager">
    </model-viewer>
  </div>

  <!-- Hidden background preloader -->
  <model-viewer id="pre" style="display:none" loading="eager"></model-viewer>

  <script>
    const MODELS = [
      ["01_Veselled","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled.glb"],
      ["02_Veselless","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/02_Veselless.glb"],
      ["03_U_Fibers","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/03_U_Fibers.glb"],
      ["04_Superficial_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/04_Superficial_SLF.glb"],
      ["05_Superficial_Arcuate","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/05_Superficial_Arcuate.glb"],
      ["06_Arcuate_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/06_Arcuate_SLF.glb"],
      ["07_Extreme_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/07_Extreme_Capsule.glb"],
      ["08_Claustrum","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/08_Claustrum.glb"],
      ["09_Putamen_External_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/09_Putamen_External_Capsule.glb"],
      ["10_Internal_Capsule_Perforators","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/10_Internal_Capsule_Perforators.glb"],
      ["11_Anterior_Comissure","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/11_Anterior_Comissure.glb"],
    ];

    const mv = document.getElementById("mv");
    const pre = document.getElementById("pre");
    const list = document.getElementById("list");

    // Per model state
    // status: idle | viewing | preloading
    const S = new Map();
    for (const [id] of MODELS) S.set(id, { loaded:false, pct:null, status:"idle" });

    let selectedId = MODELS[0][0];
    let preloadingId = null;
    let autoEnabled = true;

    function idxOf(id){ return MODELS.findIndex(x => x[0] === id); }
    function urlOf(id){ return MODELS.find(x => x[0] === id)[1]; }

    // --- Build UI ONCE, store DOM refs ---
    const rows = new Map(); // id -> {rowEl, metaEl}
    function buildUI() {
      list.innerHTML = "";
      for (const [id] of MODELS) {
        const row = document.createElement("div");
        row.className = "row";
        row.dataset.id = id;

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = id;

        const meta = document.createElement("div");
        meta.className = "meta";

        row.appendChild(name);
        row.appendChild(meta);

        // Click always works because we never recreate these elements
        row.addEventListener("click", () => select(id));

        list.appendChild(row);
        rows.set(id, { row, meta });
      }
    }

    // --- Throttled UI updates (max once per frame) ---
    let needsRender = false;
    function requestRender() {
      if (needsRender) return;
      needsRender = true;
      requestAnimationFrame(() => {
        needsRender = false;
        render();
      });
    }

    function render() {
      for (const [id] of MODELS) {
        const st = S.get(id);
        const { row, meta } = rows.get(id);

        // active highlight
        row.classList.toggle("active", id === selectedId);

        // meta display rules
        if (st.loaded) {
          meta.innerHTML = `<span class="tick">✓</span>`;
          continue;
        }

        if (st.status === "viewing" || st.status === "preloading") {
          if (st.pct != null && st.pct < 100) meta.textContent = `${st.pct}%`;
          else meta.textContent = "loading…";
        } else {
          meta.textContent = "";
        }
      }
    }

    function cancelPreloader() {
      if (preloadingId) {
        const pst = S.get(preloadingId);
        if (pst && !pst.loaded) pst.status = "idle";
      }
      preloadingId = null;
      pre.removeAttribute("src"); // cancels background load
      requestRender();
    }

    function startNextPreload(fromIndex) {
      if (!autoEnabled) return;

      for (let i = fromIndex; i < MODELS.length; i++) {
        const [id, url] = MODELS[i];
        const st = S.get(id);
        if (id === selectedId) continue;
        if (st.loaded) continue;

        preloadingId = id;
        st.status = "preloading";
        st.pct = 0;
        requestRender();

        pre.src = url;
        return;
      }
      preloadingId = null;
      requestRender();
    }

    // --- Viewer events (selected model) ---
    mv.addEventListener("progress", (e) => {
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      const st = S.get(selectedId);
      st.status = "viewing";
      st.pct = p;
      if (p === 100) st.loaded = true;
      requestRender();
    });

    mv.addEventListener("load", () => {
      const st = S.get(selectedId);
      st.loaded = true;
      st.pct = 100;
      st.status = "idle";
      requestRender();
      startNextPreload(idxOf(selectedId) + 1);
    });

    mv.addEventListener("error", () => {
      const st = S.get(selectedId);
      st.status = "idle";
      requestRender();
    });

    // --- Preloader events (background) ---
    pre.addEventListener("progress", (e) => {
      if (!preloadingId) return;
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      const st = S.get(preloadingId);
      st.status = "preloading";
      st.pct = p;
      if (p === 100) st.loaded = true;
      requestRender();
    });

    pre.addEventListener("load", () => {
      if (!preloadingId) return;

      const finished = preloadingId;
      const st = S.get(finished);
      st.loaded = true;
      st.pct = 100;
      st.status = "idle";

      const nextStart = idxOf(finished) + 1;
      preloadingId = null;
      requestRender();
      startNextPreload(nextStart);
    });

    pre.addEventListener("error", () => {
      if (!preloadingId) return;
      S.get(preloadingId).status = "idle";
      preloadingId = null;
      requestRender();
      startNextPreload(0);
    });

    // --- User selection ---
    function select(id) {
      selectedId = id;

      // Stop background (so we keep ONE download at a time)
      cancelPreloader();

      const st = S.get(id);
      if (!st.loaded) {
        st.status = "viewing";
        st.pct = 0;
      }

      requestRender();

      // switching src cancels previous mv download and starts this one
      mv.src = urlOf(id);
    }

    // Init
    buildUI();
    render();
    select(MODELS[0][0]);
  </script>
</body>
</html>
