<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Fiber Dissection Anatomy</title>
  <link rel="icon" href="data:," />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:flex; height:100vh; }
    .sidebar { width:420px; border-right:1px solid #ddd; padding:12px; overflow:auto; background:#fff; }
    .row {
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px; margin:6px 0; border:1px solid #ddd;
      border-radius:10px; background:#fff; cursor:pointer; user-select:none; gap:12px;
    }
    .row.active { border-color:#111; }
    .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta { font-size:12px; color:#666; display:flex; align-items:center; gap:8px; flex:0 0 auto; }
    .tick { color:#0a8a0a; font-weight:900; }
    .small { font-size:12px; color:#666; margin-top:10px; line-height:1.4; }
    model-viewer { width:calc(100vw - 420px); height:100vh; }

    /* hide model-viewer's own bar; we show percent in the list */
    model-viewer::part(default-progress-bar){ display:none !important; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="sidebar">
      <h3 style="margin:6px 0 12px;">Models</h3>
      <div id="list"></div>
      <div class="small">
        Loads the selected model immediately.<br>
        Background preloader runs sequentially (one at a time) and pauses when you click.
      </div>
    </div>

    <!-- Visible viewer -->
    <model-viewer id="mv"
      camera-controls
      interaction-prompt="none"
      exposure="1"
      shadow-intensity="1"
      loading="eager">
    </model-viewer>
  </div>

  <!-- Hidden background preloader (sequential) -->
  <model-viewer id="preloader" style="display:none" loading="eager"></model-viewer>

  <script>
    const MODELS = [
      ["01_Veselled","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled.glb"],
      ["02_Veselless","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/02_Veselless.glb"],
      ["03_U_Fibers","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/03_U_Fibers.glb"],
      ["04_Superficial_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/04_Superficial_SLF.glb"],
      ["05_Superficial_Arcuate","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/05_Superficial_Arcuate.glb"],
      ["06_Arcuate_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/06_Arcuate_SLF.glb"],
      ["07_Extreme_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/07_Extreme_Capsule.glb"],
      ["08_Claustrum","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/08_Claustrum.glb"],
      ["09_Putamen_External_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/09_Putamen_External_Capsule.glb"],
      ["10_Internal_Capsule_Perforators","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/10_Internal_Capsule_Perforators.glb"],
      ["11_Anterior_Comissure","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/11_Anterior_Comissure.glb"],
    ];

    const mv = document.getElementById("mv");
    const pre = document.getElementById("preloader");
    const list = document.getElementById("list");

    // state per model
    // loaded: finished at least once
    // pct: last known percent (only meaningful while loading)
    // status: idle | viewing | preloading
    const S = new Map();
    for (const [id] of MODELS) S.set(id, { loaded:false, pct:null, status:"idle" });

    let selectedId = MODELS[0][0];
    let preloadingId = null;
    let autoEnabled = true;

    function idxOf(id){ return MODELS.findIndex(x => x[0] === id); }
    function urlOf(id){ return MODELS.find(x => x[0] === id)[1]; }
    function idOfUrl(url){ const f = MODELS.find(x => x[1] === url); return f ? f[0] : null; }

    function metaFor(id){
      const st = S.get(id);

      // ✓ if done
      if (st.loaded) return `<span class="tick">✓</span>`;

      // show percent if currently loading (either viewer or preloader)
      if (st.status === "viewing" || st.status === "preloading") {
        if (st.pct != null && st.pct < 100) return `${st.pct}%`;
        return "loading…";
      }
      return "";
    }

    function render(){
      list.innerHTML = "";
      for (const [id] of MODELS) {
        const row = document.createElement("div");
        row.className = "row" + (id === selectedId ? " active" : "");
        row.onclick = () => select(id);

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = id;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = metaFor(id);

        row.appendChild(name);
        row.appendChild(meta);
        list.appendChild(row);
      }
    }

    function clearStatusesExcept(){
      for (const [id] of MODELS) {
        const st = S.get(id);
        // keep loaded state, just reset transient status/pct unless currently active
        if (id !== selectedId && id !== preloadingId) {
          if (!st.loaded) st.pct = null;
          st.status = "idle";
        }
      }
    }

    function cancelPreloader(){
      if (preloadingId) {
        const st = S.get(preloadingId);
        if (st && !st.loaded) {
          st.status = "idle";
          // keep pct if you want, or reset:
          // st.pct = null;
        }
      }
      preloadingId = null;
      pre.removeAttribute("src"); // cancels its current load
    }

    function startNextPreload(fromIndex){
      if (!autoEnabled) return;

      // don't preload while the viewer is loading something new
      // (we let mv finish first, then continue)
      // We'll call startNextPreload only after mv/pre load events.

      // find next not loaded and not the selected
      for (let i = fromIndex; i < MODELS.length; i++) {
        const [id, url] = MODELS[i];
        const st = S.get(id);
        if (id === selectedId) continue;
        if (st.loaded) continue;

        preloadingId = id;
        st.status = "preloading";
        st.pct = 0;
        render();

        pre.src = url;
        return;
      }

      // nothing left to preload
      preloadingId = null;
    }

    // ===== Viewer events (selected model) =====
    mv.addEventListener("progress", (e) => {
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      const st = S.get(selectedId);
      st.status = "viewing";
      st.pct = p;
      if (p === 100) st.loaded = true;
      clearStatusesExcept();
      render();
    });

    mv.addEventListener("load", () => {
      const st = S.get(selectedId);
      st.loaded = true;
      st.pct = 100;
      st.status = "idle";
      clearStatusesExcept();
      render();

      // After selected finishes, resume sequential preloading from next index
      startNextPreload(idxOf(selectedId) + 1);
    });

    mv.addEventListener("error", () => {
      const st = S.get(selectedId);
      st.status = "idle";
      render();
    });

    // ===== Preloader events (background) =====
    pre.addEventListener("progress", (e) => {
      if (!preloadingId) return;
      const p = Math.round((e.detail.totalProgress || 0) * 100);
      const st = S.get(preloadingId);
      st.status = "preloading";
      st.pct = p;
      if (p === 100) st.loaded = true;
      clearStatusesExcept();
      render();
    });

    pre.addEventListener("load", () => {
      if (!preloadingId) return;

      const st = S.get(preloadingId);
      st.loaded = true;
      st.pct = 100;
      st.status = "idle";

      const finishedIndex = idxOf(preloadingId);
      preloadingId = null;

      clearStatusesExcept();
      render();

      // continue sequential preloading (next one after this)
      startNextPreload(finishedIndex + 1);
    });

    pre.addEventListener("error", () => {
      if (!preloadingId) return;
      const st = S.get(preloadingId);
      st.status = "idle";
      preloadingId = null;
      render();
      // try next one
      startNextPreload(0);
    });

    // ===== User selection =====
    function select(id){
      selectedId = id;

      // pause/cancel background immediately so only selected loads now
      cancelPreloader();

      const st = S.get(id);
      if (!st.loaded) {
        st.status = "viewing";
        st.pct = 0;
      }
      clearStatusesExcept();
      render();

      // switching src cancels the previous mv download and starts this one
      mv.src = urlOf(id);
    }

    // init
    render();
    select(MODELS[0][0]);
  </script>
</body>
</html>
