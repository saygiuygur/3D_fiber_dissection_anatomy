<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Fiber Dissection Anatomy</title>
  <link rel="icon" href="data:," />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root{
      --viewer-bg: #000000;
    }

    body { margin:0; font-family: system-ui, sans-serif; }

    .wrap { display:flex; height:100vh; }

    /* keep sidebar as-is */
    .sidebar{
      width:360px;
      border-right:1px solid #ddd;
      padding:12px;
      overflow:auto;
      background:#fff;
    }

    .row{
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px; margin:6px 0;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      user-select:none;
      gap:10px;
      transition: border-color 120ms ease;
    }
    .row.active { border-color:#111; }
    .row.downloading:not(.active) { border-color: rgba(0,0,0,0.25); }

    .name{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      flex: 1 1 auto;
    }
    .meta{
      width:24px; height:24px;
      display:flex; align-items:center; justify-content:center;
      flex: 0 0 24px;
    }
    .status-icon{ width:20px; height:20px; display:block; }

    .small{ font-size:12px; color:#666; margin-top:10px; line-height:1.4; }

    .bg-section{
      margin-top:18px;
    }

    .bg-title{
      font-size:14px;
      font-weight:600;
      margin:0 0 10px 0;
    }

    .bg-options{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:8px;
    }

    .swatch{
      width:26px;
      height:26px;
      border-radius:50%;
      border:1px solid #cfcfcf;
      cursor:pointer;
      padding:0;
      background:transparent;
      display:inline-block;
      position:relative;
      box-sizing:border-box;
    }

    .swatch.black  { background:#000000; }
    .swatch.gray   { background:#808080; }
    .swatch.white  { background:#ffffff; }
    .swatch.navy   { background:#030020; }

    .swatch.selected{
      outline:2px solid #111;
      outline-offset:3px;
    }

    /* viewer background = variable */
    .viewer-wrap{
      position: relative;
      width: calc(100vw - 360px);
      height: 100vh;
      background:var(--viewer-bg);
      overflow:hidden;
    }

    model-viewer.viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:var(--viewer-bg);
    }

    .hiddenViewer { visibility: hidden; pointer-events: none; }
    .shownViewer  { visibility: visible; pointer-events: auto; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="sidebar">
      <h3 style="margin:6px 0 12px;">Models</h3>
      <div id="list"></div>

      <div class="bg-section">
        <div class="bg-title">Background Color</div>
        <div class="bg-options" id="bgOptions">
          <button class="swatch black selected" data-color="#000000" aria-label="Black background" title="Black"></button>
          <button class="swatch gray" data-color="#808080" aria-label="Gray background" title="Gray"></button>
          <button class="swatch white" data-color="#ffffff" aria-label="White background" title="White"></button>
          <button class="swatch navy" data-color="#030020" aria-label="Navy background" title="#030020"></button>
        </div>
      </div>

      <div class="small">
        Double-buffer viewer (mvA/mvB).<br>
        If the idle viewer already has the requested src, swap immediately (no waiting for load).<br>
        Background color can be changed from the sidebar.
      </div>
    </div>

    <div class="viewer-wrap">
      <model-viewer id="mvA" class="viewer shownViewer"
        camera-controls interaction-prompt="none" exposure="1" shadow-intensity="1">
      </model-viewer>

      <model-viewer id="mvB" class="viewer hiddenViewer"
        camera-controls interaction-prompt="none" exposure="1" shadow-intensity="1">
      </model-viewer>
    </div>
  </div>

  <script>
    const MODELS = [
      { id: "01_Veselled", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled.glb" },
      { id: "02_Veselless", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/02_Veselless.glb" },
      { id: "03_U_Fibers", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/03_U_Fibers.glb" },
      { id: "04_Superficial_SLF", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/04_Superficial_SLF.glb" },
      { id: "05_Superficial_Arcuate", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/05_Superficial_Arcuate.glb" },
      { id: "06_Arcuate_SLF", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/06_Arcuate_SLF.glb" },
      { id: "07_Extreme_Capsule", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/07_Extreme_Capsule.glb" },
      { id: "08_Claustrum", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/08_Claustrum.glb" },
      { id: "09_Putamen_External_Capsule", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/09_Putamen_External_Capsule.glb" },
      { id: "10_Internal_Capsule_Perforators", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/10_Internal_Capsule_Perforators.glb" },
      { id: "11_Anterior_Comissure", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/11_Anterior_Comissure.glb" },
    ];

    const list = document.getElementById('list');
    const mvA = document.getElementById('mvA');
    const mvB = document.getElementById('mvB');
    const bgOptions = document.getElementById('bgOptions');

    // Active/inactive viewer pointers
    let activeMv = mvA;
    let idleMv = mvB;

    // Selection (black border)
    let selectedId = MODELS[0].id;

    // Model state (download/progress/blob)
    const state = new Map();
    MODELS.forEach(m => state.set(m.id, { status: "idle", progressText: "", blobUrl: null }));

    // Download control
    let currentController = null;
    let currentDownloadingId = null;
    const inFlight = new Map(); // modelId -> Promise<string>

    // Preload scheduler
    let preloadEnabled = true;
    let preloadTimer = null;
    let resumeRequested = false;
    let preloadRunning = false;
    const preloadQueue = MODELS.map(m => m.id);

    // UI nodes
    const rowEls = new Map(); // id -> { row, meta }
    let downloadingVisualId = null;

    // ===== Background selector =====
    function applyBackgroundColor(color) {
      document.documentElement.style.setProperty('--viewer-bg', color);
      try {
        localStorage.setItem('viewerBgColor', color);
      } catch (_) {}
      updateSwatchSelection(color);
    }

    function updateSwatchSelection(color) {
      const swatches = bgOptions.querySelectorAll('.swatch');
      swatches.forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.color.toLowerCase() === color.toLowerCase());
      });
    }

    function initBackgroundSelector() {
      const swatches = bgOptions.querySelectorAll('.swatch');
      swatches.forEach(btn => {
        btn.addEventListener('click', () => {
          applyBackgroundColor(btn.dataset.color);
        });
      });

      let saved = null;
      try {
        saved = localStorage.getItem('viewerBgColor');
      } catch (_) {}

      const validColors = ["#000000", "#808080", "#ffffff", "#030020"];
      const startColor = validColors.includes((saved || "").toLowerCase()) ? saved : "#000000";
      applyBackgroundColor(startColor);
    }

    function paintDownloading(idOrNull) {
      if (downloadingVisualId && rowEls.get(downloadingVisualId)) {
        rowEls.get(downloadingVisualId).row.classList.remove("downloading");
      }
      downloadingVisualId = idOrNull;
      if (downloadingVisualId && rowEls.get(downloadingVisualId)) {
        rowEls.get(downloadingVisualId).row.classList.add("downloading");
      }
    }

    function paintActive() {
      for (const m of MODELS) {
        rowEls.get(m.id).row.classList.toggle("active", m.id === selectedId);
      }
    }

    function parsePercent(progressText) {
      if (!progressText) return 0;
      const match = String(progressText).match(/^(\d+)%$/);
      if (!match) return 0;
      const n = Number(match[1]);
      if (Number.isNaN(n)) return 0;
      return Math.max(0, Math.min(100, n));
    }

    function loadingIconSVG(percent) {
      const r = 7;
      const c = 2 * Math.PI * r;
      const offset = c * (1 - percent / 100);
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="${r}" fill="none" stroke="#d6d6d6" stroke-width="2.5"></circle>
          <circle cx="10" cy="10" r="${r}"
            fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-linecap="round"
            transform="rotate(-90 10 10)"
            stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
        </svg>`;
    }

    function doneIconSVG() {
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="#2e7d32"></circle>
          <path d="M6 10.2 L8.6 12.8 L14 7.4"
                fill="none" stroke="#ffffff" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>`;
    }

    function pausedIconSVG() {
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"></circle>
          <rect x="7" y="6" width="2.2" height="8" rx="0.8" fill="#757575"></rect>
          <rect x="10.8" y="6" width="2.2" height="8" rx="0.8" fill="#757575"></rect>
        </svg>`;
    }

    function errorIconSVG() {
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="#c62828"></circle>
          <rect x="9.1" y="5.2" width="1.8" height="6.8" rx="0.9" fill="#ffffff"></rect>
          <circle cx="10" cy="14.4" r="1.1" fill="#ffffff"></circle>
        </svg>`;
    }

    function refreshMeta(id) {
      const st = state.get(id);
      const meta = rowEls.get(id).meta;
      if (st.status === "done") { meta.innerHTML = doneIconSVG(); return; }
      if (st.status === "paused") { meta.innerHTML = pausedIconSVG(); return; }
      if (st.status === "error") { meta.innerHTML = errorIconSVG(); return; }
      if (st.status === "loading") { meta.innerHTML = loadingIconSVG(parsePercent(st.progressText)); return; }
      meta.innerHTML = "";
    }

    function buildListOnce() {
      list.innerHTML = "";
      for (const m of MODELS) {
        const row = document.createElement('div');
        row.className = "row";

        const name = document.createElement('div');
        name.className = "name";
        name.textContent = m.id;

        const meta = document.createElement('div');
        meta.className = "meta";

        row.appendChild(name);
        row.appendChild(meta);
        row.addEventListener('click', () => onUserSelect(m.id));

        list.appendChild(row);
        rowEls.set(m.id, { row, meta });
        refreshMeta(m.id);
      }
      paintActive();
      paintDownloading(null);
    }

    function maybeResumePreload() {
      if (!preloadEnabled) return;
      if (!resumeRequested) return;
      if (currentDownloadingId && state.get(currentDownloadingId)?.status === "loading") return;
      resumeRequested = false;
      resumePreload();
    }

    function pausePreloadForAWhile() {
      preloadEnabled = false;
      if (preloadTimer) clearTimeout(preloadTimer);
      preloadTimer = setTimeout(() => {
        preloadEnabled = true;
        resumeRequested = true;
        maybeResumePreload();
      }, 1200);
    }

    async function downloadToBlobUrl(modelId) {
      const model = MODELS.find(x => x.id === modelId);
      const st = state.get(modelId);

      if (st.status === "done" && st.blobUrl) return st.blobUrl;
      if (inFlight.has(modelId)) return inFlight.get(modelId);

      const p = (async () => {
        paintDownloading(modelId);
        st.status = "loading";
        st.progressText = "";
        refreshMeta(modelId);

        // Abort previous active download (chosen behavior)
        if (currentController) {
          currentController.abort();
          if (currentDownloadingId && currentDownloadingId !== modelId) {
            const prev = state.get(currentDownloadingId);
            if (prev && prev.status === "loading") {
              prev.status = "paused";
              refreshMeta(currentDownloadingId);
            }
          }
        }

        currentController = new AbortController();
        currentDownloadingId = modelId;

        try {
          const res = await fetch(model.url, { signal: currentController.signal });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const total = Number(res.headers.get("Content-Length")) || null;
          const reader = res.body.getReader();
          let received = 0;
          const chunks = [];

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            chunks.push(value);
            received += value.byteLength;

            st.progressText = total
              ? `${Math.floor((received / total) * 100)}%`
              : `${(received / (1024*1024)).toFixed(1)} MB`;

            refreshMeta(modelId);
          }

          const blob = new Blob(chunks, { type: "model/gltf-binary" });
          const blobUrl = URL.createObjectURL(blob);

          st.status = "done";
          st.progressText = "";
          st.blobUrl = blobUrl;
          refreshMeta(modelId);

          paintDownloading(null);
          maybeResumePreload();
          return blobUrl;

        } catch (err) {
          paintDownloading(null);

          if (err.name === "AbortError") {
            st.status = "paused";
            refreshMeta(modelId);
            maybeResumePreload();
            throw err;
          }

          st.status = "error";
          st.progressText = "";
          refreshMeta(modelId);
          maybeResumePreload();
          throw err;

        } finally {
          inFlight.delete(modelId);
        }
      })();

      inFlight.set(modelId, p);
      return p;
    }

    async function resumePreload() {
      if (!preloadEnabled) return;
      if (preloadRunning) return;
      preloadRunning = true;

      try {
        if (currentDownloadingId && state.get(currentDownloadingId)?.status === "loading") {
          resumeRequested = true;
          return;
        }

        for (const id of preloadQueue) {
          if (!preloadEnabled) return;

          const st = state.get(id);
          if (st.status === "done") continue;

          try {
            await downloadToBlobUrl(id);
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }
      } finally {
        preloadRunning = false;
      }
    }

    // ===== Camera helpers (read/apply from ACTIVE viewer) =====
    function readCamFrom(mv) {
      const o = mv.getCameraOrbit?.();
      const t = mv.getCameraTarget?.();
      const f = mv.getFieldOfView?.();
      if (!o || !t || typeof f !== "number") return null;
      return {
        orbit: { theta: o.theta, phi: o.phi, radius: o.radius },
        target: { x: t.x, y: t.y, z: t.z },
        fov: f
      };
    }

    function applyCamTo(mv, cam) {
      if (!cam) return;
      mv.cameraOrbit = `${cam.orbit.theta}rad ${cam.orbit.phi}rad ${cam.orbit.radius}m`;
      mv.cameraTarget = `${cam.target.x}m ${cam.target.y}m ${cam.target.z}m`;
      mv.fieldOfView = `${cam.fov}deg`;
      if (typeof mv.jumpCameraToGoal === "function") {
        try { mv.jumpCameraToGoal(); } catch (_) {}
      }
    }

    function swapViewersNow() {
      activeMv.classList.remove('shownViewer');
      activeMv.classList.add('hiddenViewer');
      idleMv.classList.remove('hiddenViewer');
      idleMv.classList.add('shownViewer');

      const tmp = activeMv;
      activeMv = idleMv;
      idleMv = tmp;
    }

    // ===== Show model (double-buffer) =====
    let swapToken = 0;

    async function showModel(modelId) {
      const token = ++swapToken;

      // Freeze camera at click time from the active viewer
      const camForThisSwap = readCamFrom(activeMv);

      selectedId = modelId;
      paintActive();

      // Determine target src
      const st = state.get(modelId);
      let targetSrc = null;

      if (st.status === "done" && st.blobUrl) {
        targetSrc = st.blobUrl;
      } else {
        targetSrc = null;
      }

      // If already downloaded:
      if (targetSrc) {
        const activeSrc = activeMv.src || "";
        const idleSrc = idleMv.src || "";

        if (activeSrc === targetSrc) {
          return; // already showing
        }

        if (idleSrc === targetSrc) {
          // Rule: swap immediately (no load will fire)
          if (camForThisSwap) applyCamTo(idleMv, camForThisSwap);
          swapViewersNow();
          return;
        }

        if (camForThisSwap) applyCamTo(idleMv, camForThisSwap);

        const onIdleLoad = () => {
          if (token !== swapToken) return;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (camForThisSwap) applyCamTo(idleMv, camForThisSwap);
              swapViewersNow();
            });
          });
        };
        idleMv.addEventListener('load', onIdleLoad, { once: true });

        idleMv.src = targetSrc;
        return;
      }

      // Not downloaded yet: load into idle then swap on load
      if (camForThisSwap) applyCamTo(idleMv, camForThisSwap);

      const onIdleLoad = () => {
        if (token !== swapToken) return;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (camForThisSwap) applyCamTo(idleMv, camForThisSwap);
            swapViewersNow();
          });
        });
      };
      idleMv.addEventListener('load', onIdleLoad, { once: true });

      try {
        const blobUrl = await downloadToBlobUrl(modelId);
        if (token !== swapToken) return;

        if ((idleMv.src || "") === blobUrl) {
          if (camForThisSwap) applyCamTo(idleMv, camForThisSwap);
          swapViewersNow();
          return;
        }

        idleMv.src = blobUrl;
      } catch (_) {
        // ignore
      }
    }

    function onUserSelect(modelId) {
      const st = state.get(modelId);
      if (!(st.status === "done" && st.blobUrl)) pausePreloadForAWhile();
      showModel(modelId);
    }

    (function init() {
      buildListOnce();
      initBackgroundSelector();
      showModel(selectedId).then(() => {
        resumeRequested = true;
        maybeResumePreload();
      });
    })();
  </script>
</body>
</html>
