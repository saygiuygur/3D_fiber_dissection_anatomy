<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Fiber Dissection Anatomy</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:flex; height:100vh; }
    .sidebar { width:320px; border-right:1px solid #ddd; padding:12px; overflow:auto; background:#fff; }
    .btn { width:100%; padding:10px; margin:6px 0; border:1px solid #ddd; border-radius:10px; background:#fff; text-align:left; cursor:pointer; }
    .btn.active { border-color:#111; }
    model-viewer { width:calc(100vw - 320px); height:100vh; }
    .small { font-size:12px; color:#666; margin-top:10px; line-height:1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sidebar">
      <h3 style="margin:6px 0 12px;">Models</h3>

      <button class="btn active" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled.glb">01_Veselled</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/02_Veselless.glb">02_Veselless</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/03_U_Fibers.glb">03_U_Fibers</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/04_Superficial_SLF.glb">04_Superficial_SLF</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/05_Superficial_Arcuate.glb">05_Superficial_Arcuate</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/06_Arcuate_SLF.glb">06_Arcuate_SLF</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/07_Extreme_Capsule.glb">07_Extreme_Capsule</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/08_Claustrum.glb">08_Claustrum</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/09_Putamen_External_Capsule.glb">09_Putamen_External_Capsule</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/10_Internal_Capsule_Perforators.glb">10_Internal_Capsule_Perforators</button>
      <button class="btn" data-src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/11_Anterior_Comissure.glb">11_Anterior_Comissure</button>

      <div class="small">
        Click a name → only that model loads.<br>
        If you don’t see updates, hard refresh: <b>Ctrl+F5</b>.
      </div>
    </div>

    <model-viewer id="mv"
      src="https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled.glb"
      camera-controls
      interaction-prompt="none"
      exposure="1"
      shadow-intensity="1">
    </model-viewer>
  </div>

  <script>
    const mv = document.getElementById('mv');
    const buttons = [...document.querySelectorAll('.btn')];

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mv.src = btn.dataset.src;
      });
    });
  </script>
</body>
</html>
