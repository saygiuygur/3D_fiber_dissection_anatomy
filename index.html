<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Fiber Dissection Anatomy</title>
  <link rel="icon" href="data:," />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root{ --viewer-bg: #ffffff; }

    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:flex; height:100vh; }

    .sidebar{
      width:360px;
      border-right:1px solid #ddd;
      padding:12px;
      overflow:auto;
      background:#fff;
    }

    .row{
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px; margin:6px 0;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      user-select:none;
      gap:10px;
      transition: border-color 120ms ease;
    }
    .row.active { border-color:#111; }
    .row.downloading:not(.active) { border-color: rgba(0,0,0,0.25); }

    .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex: 1 1 auto; }
    .meta{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex: 0 0 24px; }
    .status-icon{ width:20px; height:20px; display:block; }
    .small{ font-size:12px; color:#666; margin-top:10px; line-height:1.4; }

    .bg-section{ margin-top:18px; }
    .bg-title{ font-size:14px; font-weight:600; margin:0 0 10px 0; }
    .bg-options{ display:flex; align-items:center; gap:14px; margin-bottom:8px; }

    .swatch{
      width:26px; height:26px;
      border-radius:50%;
      border:1px solid #cfcfcf;
      cursor:pointer;
      padding:0;
      display:inline-block;
      box-sizing:border-box;
    }
    .swatch.white{ background:#ffffff; }
    .swatch.gray{ background:#808080; }
    .swatch.black{ background:#000000; }
    .swatch.selected{ outline:2px solid #111; outline-offset:3px; }

    .viewer-wrap{
      position: relative;
      width: calc(100vw - 360px);
      height: 100vh;
      background:var(--viewer-bg);
      overflow:hidden;
    }

    model-viewer.viewer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:var(--viewer-bg);
    }

    .hiddenViewer { visibility: hidden; pointer-events: none; }
    .shownViewer  { visibility: visible; pointer-events: auto; }

    /* Dot-only hotspot */
    .hotspot{
      width: 14px;
      height: 14px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #000;
      background: rgba(255,255,255,0.65);
      cursor: default;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
    }
    .hotspot.occluded{
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="sidebar">
      <h3 style="margin:6px 0 12px;">Models</h3>
      <div id="list"></div>

      <div class="bg-section">
        <div class="bg-title">Background Color</div>
        <div class="bg-options" id="bgOptions">
          <button class="swatch white selected" data-color="#ffffff" aria-label="White background" title="White"></button>
          <button class="swatch gray" data-color="#808080" aria-label="Gray background" title="Gray"></button>
          <button class="swatch black" data-color="#000000" aria-label="Black background" title="Black"></button>
        </div>
      </div>

      <div class="small">
        Hotspots are hidden when truly occluded (raycast).<br>
        Loading icons restored.
      </div>
    </div>

    <div class="viewer-wrap">
      <model-viewer id="mvA" class="viewer shownViewer"
        camera-controls interaction-prompt="none" exposure="1" shadow-intensity="1">
      </model-viewer>
      <model-viewer id="mvB" class="viewer hiddenViewer"
        camera-controls interaction-prompt="none" exposure="1" shadow-intensity="1">
      </model-viewer>
    </div>
  </div>

  <!-- IMPORTANT: use module so we can import THREE reliably -->
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.172.0/build/three.module.js";

    // ---------------- Models ----------------
    const MODELS = [
      { id: "01_Veselled_Annotated", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled_Annotated.glb" },
      { id: "02_Veselless_Annotated", url: "https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/02_Veselless_Annotated.glb" }
    ];

    // ---------------- Anchor names ----------------
    const MODEL01_NAMES = [
      "TrolardV001","SylvianV001","SuperiorparietalA001","PrefrontalA001","PrecentralsulcusA001",
      "PosteriortemporalA001","PosteriorparietalA001","PIFA001","PericallosalA001","PCA001",
      "ParacentralA001","OpticN001","OlfactoryN001","OlfactoryA001","MIFA001","MiddletemporalA001",
      "MedialOrbitofrontalA001","LateralorbitofrontalA001","LabbeV001","InternalcerebralV001",
      "InferiorparietalA001","ICA001","GalenV001","FrontopolarACont001","FrontopolarA001",
      "CentralsulcusA001","CallosomarginalA001","Basalveinofrosenthal001","AnteriortemporalA001",
      "AnteriorparietalA001","AIFA001","ACA001"
    ];

    const MODEL02_NAMES = [
      "Uncus001","Thalamus001","TemporalOperculum001","Sylvianfissure001","Supramarginalgyrus001",
      "SuperiortemporalSulcus001","SuperiortemporalGyrus001","Superiorparietallobule001","SuperiorFrontalsulcus001",
      "SuperiorFrontalgyrus001","Preoccipitalnotch001","Precuneus001","Precentralsulcus001","Precentralgyrus001",
      "Posteriorcalcarinesulcus001","Postcentralgyrus001","Parietooccipitalsulcus001","ParietalOperculum001",
      "Parahippocampalgyrus001","Paracentrallobule001","MiddletemporalGyrus001","Middlefrontalgyrus001","Marginalsulcus001",
      "Lingualgyrus001","Lateralventricle001","Isthmusgyrus001","Intraparietalsulcus001","Inferiortemporalsulcus001",
      "Inferiortemporalgyrus001","InferiorFrontalsulcus001","InferiorFrontalgyrus001","Gyrusrectus001","Fusiformgyrus001",
      "FrontalOperculum001","Cuneus001","Corpuscallosum001","Collateralsulcus001","Cingulategyrus001","Centralsulcus001",
      "Anteriorcalcarinesulcus001","Angulargyrus001"
    ];

    function makeAnnotations(names) {
      return names.map((name, i) => ({
        slotName: `hotspot-${String(i + 1).padStart(2, '0')}`,
        anchor: name,
        title: name
      }));
    }
    const ANNOTATIONS = {
      "01_Veselled_Annotated": makeAnnotations(MODEL01_NAMES),
      "02_Veselless_Annotated": makeAnnotations(MODEL02_NAMES)
    };

    // ---------------- DOM ----------------
    const list = document.getElementById('list');
    const mvA = document.getElementById('mvA');
    const mvB = document.getElementById('mvB');
    const bgOptions = document.getElementById('bgOptions');

    let activeMv = mvA;
    let idleMv = mvB;
    let selectedId = MODELS[0].id;

    // ---------------- Download + UI state (restored) ----------------
    const state = new Map();
    MODELS.forEach(m => state.set(m.id, { status: "idle", progressText: "", blobUrl: null }));

    let currentController = null;
    let currentDownloadingId = null;
    const inFlight = new Map();

    let preloadEnabled = true;
    let preloadTimer = null;
    let resumeRequested = false;
    let preloadRunning = false;
    const preloadQueue = MODELS.map(m => m.id);

    const rowEls = new Map();
    let downloadingVisualId = null;

    // ---- background selector ----
    function applyBackgroundColor(color) {
      document.documentElement.style.setProperty('--viewer-bg', color);
      try { localStorage.setItem('viewerBgColor', color); } catch (_) {}
      bgOptions.querySelectorAll('.swatch').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.color.toLowerCase() === color.toLowerCase());
      });
    }
    function initBackgroundSelector() {
      bgOptions.querySelectorAll('.swatch').forEach(btn => {
        btn.addEventListener('click', () => applyBackgroundColor(btn.dataset.color));
      });
      let saved = null;
      try { saved = localStorage.getItem('viewerBgColor'); } catch (_) {}
      const valid = ["#ffffff","#808080","#000000"];
      applyBackgroundColor(valid.includes((saved||"").toLowerCase()) ? saved : "#ffffff");
    }

    // ---- loading icons ----
    function parsePercent(progressText) {
      const match = String(progressText || "").match(/^(\d+)%$/);
      if (!match) return 0;
      const n = Number(match[1]);
      return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0;
    }

    function loadingIconSVG(percent) {
      const r = 7;
      const c = 2 * Math.PI * r;
      const offset = c * (1 - percent / 100);
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="${r}" fill="none" stroke="#d6d6d6" stroke-width="2.5"></circle>
          <circle cx="10" cy="10" r="${r}"
            fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-linecap="round"
            transform="rotate(-90 10 10)"
            stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
        </svg>`;
    }
    function doneIconSVG() {
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="#2e7d32"></circle>
          <path d="M6 10.2 L8.6 12.8 L14 7.4"
                fill="none" stroke="#ffffff" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>`;
    }
    function pausedIconSVG() {
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"></circle>
          <rect x="7" y="6" width="2.2" height="8" rx="0.8" fill="#757575"></rect>
          <rect x="10.8" y="6" width="2.2" height="8" rx="0.8" fill="#757575"></rect>
        </svg>`;
    }
    function errorIconSVG() {
      return `
        <svg class="status-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="#c62828"></circle>
          <rect x="9.1" y="5.2" width="1.8" height="6.8" rx="0.9" fill="#ffffff"></rect>
          <circle cx="10" cy="14.4" r="1.1" fill="#ffffff"></circle>
        </svg>`;
    }
    function refreshMeta(id) {
      const st = state.get(id);
      const meta = rowEls.get(id).meta;
      if (st.status === "done") { meta.innerHTML = doneIconSVG(); return; }
      if (st.status === "paused") { meta.innerHTML = pausedIconSVG(); return; }
      if (st.status === "error") { meta.innerHTML = errorIconSVG(); return; }
      if (st.status === "loading") { meta.innerHTML = loadingIconSVG(parsePercent(st.progressText)); return; }
      meta.innerHTML = "";
    }

    // ---- list UI ----
    function paintDownloading(idOrNull) {
      if (downloadingVisualId && rowEls.get(downloadingVisualId)) rowEls.get(downloadingVisualId).row.classList.remove("downloading");
      downloadingVisualId = idOrNull;
      if (downloadingVisualId && rowEls.get(downloadingVisualId)) rowEls.get(downloadingVisualId).row.classList.add("downloading");
    }
    function paintActive() {
      for (const m of MODELS) rowEls.get(m.id).row.classList.toggle("active", m.id === selectedId);
    }
    function buildListOnce() {
      list.innerHTML = "";
      for (const m of MODELS) {
        const row = document.createElement('div');
        row.className = "row";

        const name = document.createElement('div');
        name.className = "name";
        name.textContent = m.id;

        const meta = document.createElement('div');
        meta.className = "meta";

        row.appendChild(name);
        row.appendChild(meta);
        row.addEventListener('click', () => onUserSelect(m.id));

        list.appendChild(row);
        rowEls.set(m.id, { row, meta });
        refreshMeta(m.id);
      }
      paintActive();
      paintDownloading(null);
    }

    // ---- preload helpers ----
    function maybeResumePreload() {
      if (!preloadEnabled) return;
      if (!resumeRequested) return;
      if (currentDownloadingId && state.get(currentDownloadingId)?.status === "loading") return;
      resumeRequested = false;
      resumePreload();
    }
    function pausePreloadForAWhile() {
      preloadEnabled = false;
      if (preloadTimer) clearTimeout(preloadTimer);
      preloadTimer = setTimeout(() => {
        preloadEnabled = true;
        resumeRequested = true;
        maybeResumePreload();
      }, 1200);
    }

    // ---- download ----
    async function downloadToBlobUrl(modelId) {
      const model = MODELS.find(x => x.id === modelId);
      const st = state.get(modelId);
      if (st.status === "done" && st.blobUrl) return st.blobUrl;
      if (inFlight.has(modelId)) return inFlight.get(modelId);

      const p = (async () => {
        paintDownloading(modelId);
        st.status = "loading";
        st.progressText = "";
        refreshMeta(modelId);

        if (currentController) {
          currentController.abort();
          if (currentDownloadingId && currentDownloadingId !== modelId) {
            const prev = state.get(currentDownloadingId);
            if (prev && prev.status === "loading") {
              prev.status = "paused";
              refreshMeta(currentDownloadingId);
            }
          }
        }

        currentController = new AbortController();
        currentDownloadingId = modelId;

        try {
          const res = await fetch(model.url, { signal: currentController.signal });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const total = Number(res.headers.get("Content-Length")) || null;
          const reader = res.body.getReader();
          let received = 0;
          const chunks = [];

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.byteLength;

            st.progressText = total ? `${Math.floor((received / total) * 100)}%` : "";
            refreshMeta(modelId);
          }

          const blob = new Blob(chunks, { type: "model/gltf-binary" });
          const blobUrl = URL.createObjectURL(blob);

          st.status = "done";
          st.progressText = "";
          st.blobUrl = blobUrl;
          refreshMeta(modelId);

          paintDownloading(null);
          maybeResumePreload();
          return blobUrl;

        } catch (err) {
          paintDownloading(null);
          if (err.name === "AbortError") {
            st.status = "paused";
            refreshMeta(modelId);
            maybeResumePreload();
            throw err;
          }
          st.status = "error";
          st.progressText = "";
          refreshMeta(modelId);
          maybeResumePreload();
          throw err;
        } finally {
          inFlight.delete(modelId);
        }
      })();

      inFlight.set(modelId, p);
      return p;
    }

    async function resumePreload() {
      if (!preloadEnabled) return;
      if (preloadRunning) return;
      preloadRunning = true;
      try {
        for (const id of preloadQueue) {
          if (!preloadEnabled) return;
          const st = state.get(id);
          if (st.status === "done") continue;
          try { await downloadToBlobUrl(id); }
          catch (e) { if (e.name === "AbortError") return; }
        }
      } finally {
        preloadRunning = false;
      }
    }

    // ---------------- Camera math ----------------
    function readCameraOrbit(mv) {
      const o = mv.getCameraOrbit?.();
      const t = mv.getCameraTarget?.();
      if (!o || !t) return null;
      return { theta:o.theta, phi:o.phi, radius:o.radius, target:{x:t.x,y:t.y,z:t.z} };
    }
    function orbitToPosition({theta, phi, radius, target}) {
      const sinPhi = Math.sin(phi);
      return {
        x: target.x + radius * sinPhi * Math.sin(theta),
        y: target.y + radius * Math.cos(phi),
        z: target.z + radius * sinPhi * Math.cos(theta)
      };
    }
    function applyCamTo(mv, cam) {
      if (!cam) return;
      mv.cameraOrbit = `${cam.theta}rad ${cam.phi}rad ${cam.radius}m`;
      mv.cameraTarget = `${cam.target.x}m ${cam.target.y}m ${cam.target.z}m`;
      if (typeof mv.jumpCameraToGoal === "function") { try { mv.jumpCameraToGoal(); } catch (_) {} }
    }

    // ---------------- Double buffer swap ----------------
    function swapViewersNow() {
      activeMv.classList.remove('shownViewer');
      activeMv.classList.add('hiddenViewer');
      idleMv.classList.remove('hiddenViewer');
      idleMv.classList.add('shownViewer');
      const tmp = activeMv; activeMv = idleMv; idleMv = tmp;
    }

    // ---------------- Scene access ----------------
    function getThreeScene(mv) {
      const sceneSym = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
      return sceneSym ? mv[sceneSym] : null;
    }

    // ---------------- Hotspots + occlusion ----------------
    const occlusionData = new WeakMap();
    const occlusionTimers = new WeakMap();

    function clearHotspots(mv) {
      mv.querySelectorAll('[slot^="hotspot-"]').forEach(el => el.remove());
    }

    function ensureHotspotElements(mv, modelId) {
      clearHotspots(mv);
      const anns = ANNOTATIONS[modelId] || [];
      for (const a of anns) {
        const btn = document.createElement('button');
        btn.className = 'hotspot';
        btn.setAttribute('slot', a.slotName);
        btn.title = a.title;
        btn.textContent = "";
        btn.dataset.position = '0m 0m 0m';
        btn.dataset.normal = '0m 1m 0m';
        mv.appendChild(btn);
      }
    }

    function updateHotspotsPositions(mv, modelId) {
      const scene = getThreeScene(mv);
      if (!scene || typeof scene.getObjectByName !== 'function') return;
      if (typeof scene.updateMatrixWorld === 'function') scene.updateMatrixWorld(true);

      const center = mv.getBoundingBoxCenter?.() || { x: 0, y: 0, z: 0 };
      const anns = ANNOTATIONS[modelId] || [];

      for (const a of anns) {
        const obj = scene.getObjectByName(a.anchor);
        if (!obj) continue;

        const p = new THREE.Vector3();
        obj.getWorldPosition(p);

        // hotspot-space = glTF-space + bbox center offset (your working fix)
        const x = p.x + center.x;
        const y = p.y + center.y;
        const z = p.z + center.z;

        const posStr = `${x}m ${y}m ${z}m`;
        try { mv.updateHotspot({ name: a.slotName, position: posStr, normal: "0m 1m 0m" }); }
        catch {
          const el = mv.querySelector(`[slot="${a.slotName}"]`);
          if (el) el.dataset.position = posStr;
        }
      }
    }

    function prepareOcclusionData(mv, modelId) {
      const scene = getThreeScene(mv);
      if (!scene || typeof scene.traverse !== 'function') {
        occlusionData.set(mv, null);
        return;
      }
      if (typeof scene.updateMatrixWorld === 'function') scene.updateMatrixWorld(true);

      // collect meshes
      const meshes = [];
      scene.traverse(o => { if (o && o.isMesh) meshes.push(o); });

      // store glTF-space positions per slot
      const anns = ANNOTATIONS[modelId] || [];
      const positionsGltf = new Map();
      for (const a of anns) {
        const obj = scene.getObjectByName?.(a.anchor);
        if (!obj) continue;
        const p = new THREE.Vector3();
        obj.getWorldPosition(p);
        positionsGltf.set(a.slotName, p.clone());
      }

      occlusionData.set(mv, { meshes, positionsGltf, modelId });
    }

    function runOcclusion(mv) {
      const data = occlusionData.get(mv);
      if (!data) return;
      const { meshes, positionsGltf } = data;
      if (!meshes?.length || !positionsGltf?.size) return;

      const cam = readCameraOrbit(mv);
      if (!cam) return;

      const center = mv.getBoundingBoxCenter?.() || { x: 0, y: 0, z: 0 };

      // camera in hotspot-space -> convert to glTF-space by subtracting center
      const camHot = orbitToPosition(cam);
      const origin = new THREE.Vector3(camHot.x - center.x, camHot.y - center.y, camHot.z - center.z);

      const raycaster = new THREE.Raycaster();
      const EPS = 1e-4;

      for (const [slotName, point] of positionsGltf.entries()) {
        const dir = point.clone().sub(origin);
        const dist = dir.length();
        if (dist < EPS) continue;

        dir.normalize();
        raycaster.set(origin, dir);
        raycaster.far = dist - EPS;

        const hits = raycaster.intersectObjects(meshes, true);
        const occluded = hits.length > 0;

        const el = mv.querySelector(`[slot="${slotName}"]`);
        if (el) el.classList.toggle("occluded", occluded);
      }
    }

    function scheduleOcclusion(mv) {
      const prev = occlusionTimers.get(mv);
      if (prev) clearTimeout(prev);
      const t = setTimeout(() => runOcclusion(mv), 80);
      occlusionTimers.set(mv, t);
    }

    function prepareAnnotationsForViewer(mv, modelId) {
      ensureHotspotElements(mv, modelId);

      requestAnimationFrame(() => requestAnimationFrame(() => {
        updateHotspotsPositions(mv, modelId);
        prepareOcclusionData(mv, modelId);
        runOcclusion(mv);
      }));

      // avoid duplicate listeners
      if (!mv.__hasOcclusionListener) {
        mv.addEventListener("camera-change", () => scheduleOcclusion(mv), { passive:true });
        mv.__hasOcclusionListener = true;
      }
    }

    // ---------------- show model ----------------
    let swapToken = 0;

    async function showModel(modelId) {
      const token = ++swapToken;
      const cam = readCameraOrbit(activeMv);

      selectedId = modelId;
      paintActive();

      const st = state.get(modelId);
      const targetSrc = (st.status === "done" && st.blobUrl) ? st.blobUrl : null;

      if (targetSrc) {
        const activeSrc = activeMv.src || "";
        const idleSrc = idleMv.src || "";

        if (activeSrc === targetSrc) return;

        if (idleSrc === targetSrc) {
          if (cam) applyCamTo(idleMv, cam);
          prepareAnnotationsForViewer(idleMv, modelId);
          swapViewersNow();
          scheduleOcclusion(activeMv);
          return;
        }

        if (cam) applyCamTo(idleMv, cam);

        const onIdleLoad = () => {
          if (token !== swapToken) return;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (cam) applyCamTo(idleMv, cam);
            prepareAnnotationsForViewer(idleMv, modelId);
            swapViewersNow();
            scheduleOcclusion(activeMv);
          }));
        };
        idleMv.addEventListener("load", onIdleLoad, { once:true });

        idleMv.src = targetSrc;
        return;
      }

      if (cam) applyCamTo(idleMv, cam);

      const onIdleLoad = () => {
        if (token !== swapToken) return;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (cam) applyCamTo(idleMv, cam);
          prepareAnnotationsForViewer(idleMv, modelId);
          swapViewersNow();
          scheduleOcclusion(activeMv);
        }));
      };
      idleMv.addEventListener("load", onIdleLoad, { once:true });

      try {
        const blobUrl = await downloadToBlobUrl(modelId);
        if (token !== swapToken) return;
        idleMv.src = blobUrl;
      } catch {}
    }

    function onUserSelect(modelId) {
      const st = state.get(modelId);
      if (!(st.status === "done" && st.blobUrl)) pausePreloadForAWhile();
      showModel(modelId);
    }

    // ---------------- init ----------------
    buildListOnce();
    initBackgroundSelector();
    showModel(selectedId).then(() => {
      resumeRequested = true;
      maybeResumePreload();
    });
  </script>
</body>
</html>
