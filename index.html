<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Fiber Dissection Anatomy</title>

  <!-- Kill favicon.ico request -->
  <link rel="icon" href="data:," />

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:flex; height:100vh; }
    .sidebar { width:380px; border-right:1px solid #ddd; padding:12px; overflow:auto; background:#fff; }
    .row {
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px; margin:6px 0; border:1px solid #ddd;
      border-radius:10px; background:#fff; cursor:pointer; user-select:none;
      gap:12px;
    }
    .row.active { border-color:#111; }
    .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta { font-size:12px; color:#666; display:flex; align-items:center; gap:8px; flex: 0 0 auto; }
    .tick { color:#0a8a0a; font-weight:800; }
    .small { font-size:12px; color:#666; margin-top:10px; line-height:1.4; }
    model-viewer { width:calc(100vw - 380px); height:100vh; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sidebar">
      <h3 style="margin:6px 0 12px;">Models</h3>
      <div id="list"></div>
      <div class="small">
        Auto-downloads 01 → 11. Clicking a model prioritizes it (current download is aborted & marked paused).
      </div>
    </div>

    <model-viewer id="mv"
      camera-controls
      interaction-prompt="none"
      exposure="1"
      shadow-intensity="1"
      loading="eager">
    </model-viewer>
  </div>

  <script>
    const MODELS = [
      ["01_Veselled","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/01_Veselled.glb"],
      ["02_Veselless","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/02_Veselless.glb"],
      ["03_U_Fibers","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/03_U_Fibers.glb"],
      ["04_Superficial_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/04_Superficial_SLF.glb"],
      ["05_Superficial_Arcuate","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/05_Superficial_Arcuate.glb"],
      ["06_Arcuate_SLF","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/06_Arcuate_SLF.glb"],
      ["07_Extreme_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/07_Extreme_Capsule.glb"],
      ["08_Claustrum","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/08_Claustrum.glb"],
      ["09_Putamen_External_Capsule","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/09_Putamen_External_Capsule.glb"],
      ["10_Internal_Capsule_Perforators","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/10_Internal_Capsule_Perforators.glb"],
      ["11_Anterior_Comissure","https://raw.githubusercontent.com/saygiuygur/3D_fiber_dissection_anatomy/main/models/11_Anterior_Comissure.glb"],
    ];

    const mv = document.getElementById("mv");
    const list = document.getElementById("list");

    // State per model
    const state = new Map(); // id -> {status, pct, mb, blobUrl}
    for (const [id] of MODELS) state.set(id, { status:"idle", pct:null, mb:0, blobUrl:null });

    // Download manager
    let activeId = MODELS[0][0];
    let controller = null;
    let downloadingId = null;

    // Queue of ids to download (in order)
    let queue = MODELS.map(([id]) => id);

    function metaText(st){
      if (st.status === "done") return `<span class="tick">✓</span>`;
      if (st.status === "paused") {
        if (st.pct != null) return `paused (${st.pct}%)`;
        if (st.mb > 0) return `paused (${st.mb.toFixed(1)}MB)`;
        return "paused";
      }
      if (st.status === "loading") {
        if (st.pct != null) return `${st.pct}%`;
        if (st.mb > 0) return `${st.mb.toFixed(1)}MB`;
        return "loading…";
      }
      if (st.status === "error") return "error";
      return "";
    }

    function render(){
      list.innerHTML = "";
      for (const [id] of MODELS) {
        const st = state.get(id);

        const row = document.createElement("div");
        row.className = "row" + (id === activeId ? " active" : "");
        row.onclick = () => selectModel(id);

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = id;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = metaText(st);

        row.appendChild(name);
        row.appendChild(meta);
        list.appendChild(row);
      }
    }

    function findUrl(id){
      return MODELS.find(x => x[0] === id)[1];
    }

    async function download(id){
      const st = state.get(id);
      if (st.status === "done" && st.blobUrl) return st.blobUrl;

      // Abort current download if any
      if (controller) {
        controller.abort();
        if (downloadingId && downloadingId !== id) {
          const prev = state.get(downloadingId);
          if (prev && prev.status === "loading") prev.status = "paused";
        }
      }

      controller = new AbortController();
      downloadingId = id;

      st.status = "loading";
      st.pct = null;
      st.mb = 0;
      render();

      const url = findUrl(id);
      const res = await fetch(url, { signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const total = Number(res.headers.get("Content-Length")) || null;
      const reader = res.body.getReader();
      let received = 0;
      const chunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.byteLength;

        st.mb = received / (1024*1024);
        if (total) st.pct = Math.floor((received / total) * 100);
        render();
      }

      const blob = new Blob(chunks, { type:"model/gltf-binary" });
      const blobUrl = URL.createObjectURL(blob);

      st.status = "done";
      st.pct = 100;
      st.blobUrl = blobUrl;
      render();

      return blobUrl;
    }

    async function show(id){
      const st = state.get(id);
      activeId = id;
      render();

      // If already downloaded, instant
      if (st.status === "done" && st.blobUrl) {
        mv.src = st.blobUrl;
        return;
      }

      try {
        const blobUrl = await download(id);
        mv.src = blobUrl;
      } catch (e) {
        if (e.name === "AbortError") return; // expected
        state.get(id).status = "error";
        render();
      }
    }

    function prioritizeInQueue(id){
      // Put id at front of queue, keep order of others
      queue = [id, ...queue.filter(x => x !== id)];
    }

    async function pumpQueue(){
      // Only one download at a time, sequential
      while (true) {
        // next item not done
        const next = queue.find(x => state.get(x).status !== "done");
        if (!next) return;

        try {
          await download(next);
          // don't auto-show every downloaded model; only show the active one
          // (but the first model will be shown by init)
        } catch (e) {
          if (e.name === "AbortError") return; // user clicked something else -> stop pump, will restart
          state.get(next).status = "error";
          render();
          // continue to the next
          queue = queue.filter(x => x !== next);
        }
      }
    }

    function selectModel(id){
      prioritizeInQueue(id);
      show(id);            // load+show clicked immediately
      pumpQueue();         // restart background downloading in new priority order
    }

    // Hide model-viewer's own top progress bar (we show progress in list)
    // Setting "interaction-prompt" already reduces UI; this removes the bar via CSS:
    const style = document.createElement("style");
    style.textContent = `model-viewer::part(default-progress-bar){ display:none !important; }`;
    document.head.appendChild(style);

    // Init
    render();
    // Start with first model shown and start preloading the rest
    selectModel(MODELS[0][0]);
  </script>
</body>
</html>
